# FioFilter — Default Profile
# Policy overlay: default evidence disposition table
# This file is informational. The authoritative implementation is
# fiofilter/profiles/default.py

profile_id: default
description: Core evidence taxonomy disposition table

# Disposition table
# Format: evidence_class: [EXPLORE, BUILD, PROVE]
dispositions:
  NOISE:           [TRANSFORM_T01, TRANSFORM_T01, TRANSFORM_T01]
  DISCOVERY:       [TRANSFORM_T01, TRANSFORM_T01, RAW]
  PROGRESS:        [TRANSFORM_T01, TRANSFORM_T01, RAW]
  SUCCESS_SUMMARY: [TRANSFORM_T01, TRANSFORM_T01, RAW]
  DIAGNOSTIC:      [TRANSFORM_T01, RAW, RAW]
  FAILURE:         [RAW, RAW, RAW]
  CANONICAL_STATE: [RAW, RAW, RAW]
  MACHINE_DATA:    [LOSSLESS_ONLY, LOSSLESS_ONLY, RAW]
  AUTHORITY:       [RAW, RAW, RAW]
  SECURITY:        [RAW, RAW, RAW]
  BENCHMARK:       [RAW, RAW, RAW]
  UNKNOWN:         [RAW, RAW, RAW]

# Notes:
# LOSSLESS_ONLY: In V0, no lossless transforms are implemented (T04 is a candidate).
# MACHINE_DATA defaults to RAW in V0.
# Invariants I5, I6, I7, I12 override this table if they fire.
